<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="全民嘲家">
  <meta name="format-detection" content="telephone=no">
  <title>全民嘲家 - AI裁判辩论平台</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      -webkit-overflow-scrolling: touch;
    }
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    html.light, html.light body {
      background-color: #ffffff !important;
      color: #000000;
    }
    html.dark, html.dark body {
      background-color: #1a1a1a !important;
      color: #ffffff;
    }
  </style>
  <script>
    (function() {
      function applyThemeToDOM(theme) {
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-theme', theme);
      }
      applyThemeToDOM('dark');
      if (window.self !== window.top) {
        window.addEventListener('message', function(event) {
          if (event.data && typeof event.data.theme === 'string') {
            var theme = event.data.theme;
            if (theme === 'light' || theme === 'dark') {
              applyThemeToDOM(theme);
            }
          }
        });
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#fff;font-size:18px;text-align:center;padding:20px;">
      请启用 JavaScript 以使用全民嘲家
    </div>
  </noscript>
  <script>
    window.__appErrors = [];
    window.onerror = function(msg, url, line, col, error) {
      window.__appErrors.push({msg: msg, url: url, line: line, col: col, error: error ? error.message : ''});
      var root = document.getElementById('root');
      if (root && root.children.length === 0) {
        root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#fff;font-size:14px;text-align:center;padding:20px;gap:12px;"><p style="font-size:16px;">应用启动失败</p><p style="color:#94a3b8;word-break:break-all;">' + msg + '</p><button onclick="location.reload()" style="padding:12px 24px;background:#7c3aed;color:#fff;border:none;border-radius:12px;font-size:14px;cursor:pointer;">点击重试</button></div>';
      }
    };
    window.__appLoadTimer = setTimeout(function() {
      var root = document.getElementById('root');
      if (root && root.children.length === 0) {
        var errMsg = window.__appErrors.length > 0 ? window.__appErrors[0].msg : '脚本加载超时';
        root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#fff;font-size:14px;text-align:center;padding:20px;gap:12px;"><p style="font-size:16px;">加载中...</p><p style="color:#94a3b8;word-break:break-all;">' + errMsg + '</p><button onclick="location.reload()" style="padding:12px 24px;background:#7c3aed;color:#fff;border:none;border-radius:12px;font-size:14px;cursor:pointer;">点击重试</button></div>';
      }
    }, 15000);
  </script>
</body>
</html>
