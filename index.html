<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="全民嘲家">
  <meta name="format-detection" content="telephone=no">
  <title>全民嘲家 - AI裁判辩论平台</title>
  <style>
    /* 内联样式确保主题色立即生效，避免闪烁 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      -webkit-overflow-scrolling: touch;
    }
    /* iOS 安全区域适配 */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    html.light, html.light body {
      background-color: #ffffff !important;
      color: #000000;
    }
    html.dark, html.dark body {
      background-color: #1a1a1a !important;
      color: #ffffff;
    }
  </style>
  <script>
    // 在 React 加载前立即设置主题，避免闪烁
    (function() {
      function applyThemeToDOM(theme) {
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-theme', theme);
      }

      // 默认使用 dark 主题
      applyThemeToDOM('dark');

      // iPad 等比例适配：强制使用 iPhone 的 viewport 宽度，浏览器自动放大填满屏幕
      var isIPad = navigator.userAgent.match(/iPad/) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIPad) {
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta) {
          meta.setAttribute('content', 'width=390, viewport-fit=cover');
        }
      }

      // iframe 环境下监听父窗口主题消息
      if (window.self !== window.top) {
        window.addEventListener('message', function(event) {
          if (event.data && typeof event.data.theme === 'string') {
            var theme = event.data.theme;
            if (theme === 'light' || theme === 'dark') {
              applyThemeToDOM(theme);
            }
          }
        });
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#fff;font-size:18px;text-align:center;padding:20px;">
      请启用 JavaScript 以使用全民嘲家
    </div>
  </noscript>
  <script>
    // 超时检测：如果 10 秒后 React 仍未渲染，显示重试提示
    window.__appLoadTimer = setTimeout(function() {
      var root = document.getElementById('root');
      if (root && root.children.length === 0) {
        root.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;color:#fff;font-size:16px;text-align:center;padding:20px;gap:16px;"><p>加载中，请稍候...</p><button onclick="location.reload()" style="padding:12px 24px;background:#7c3aed;color:#fff;border:none;border-radius:12px;font-size:14px;cursor:pointer;">点击重试</button></div>';
      }
    }, 10000);
  </script>
</body>
</html>
